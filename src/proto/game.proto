syntax = "proto3";

package game;

// Avatar related messages
message AvatarCreate {
  string id = 1;
  float x = 2;
  float y = 3;
  string name = 4;
  string sprite_url = 5;
}

message AvatarMove {
  string id = 1;
  float x = 2;
  float y = 3;
}

message AvatarRemove {
  string id = 1;
}

// Object related messages
message ObjectCreate {
  string id = 1;
  float x = 2;
  float y = 3;
  string type = 4;
  string sprite_url = 5;
}

message ObjectPickup {
  string object_id = 1;
  string avatar_id = 2;
}

// NPC related messages
message NpcSpawn {
  string id = 1;
  float x = 2;
  float y = 3;
  string npc_type = 4;
  string sprite_url = 5;
}

message NpcMove {
  string id = 1;
  float x = 2;
  float y = 3;
}

// World related messages
message WorldTime {
  int32 hour = 1;
  int32 minute = 2;
}

message WorldWeather {
  string weather_type = 1;
  float intensity = 2;
}

// Generic game message wrapper
message GameMessage {
  string type = 1;
  oneof payload {
    AvatarCreate avatar_create = 2;
    AvatarMove avatar_move = 3;
    AvatarRemove avatar_remove = 4;
    ObjectCreate object_create = 5;
    ObjectPickup object_pickup = 6;
    NpcSpawn npc_spawn = 7;
    NpcMove npc_move = 8;
    WorldTime world_time = 9;
    WorldWeather world_weather = 10;
  }
}
